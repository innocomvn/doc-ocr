name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # TypeScript Build and Lint
  typescript-check:
    name: TypeScript Build & Type Check
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [16.x, 18.x, 20.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: TypeScript type check
      run: npx tsc --noEmit

    - name: Build TypeScript
      run: npm run build

    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: dist-${{ matrix.node-version }}
        path: dist/
        retention-days: 7

  # Python Dependencies Check
  python-check:
    name: Python Dependencies Check
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11']

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirement.txt

    - name: Check Python syntax
      run: |
        python -m py_compile ocr_api.py
        python -m py_compile scripts/export_recognition_to_onnx.py

  # Docker Build Test
  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Build Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: false
        tags: vietnamese-ocr-api:test
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Test Docker image
      run: |
        docker run -d --name test-container -p 3000:3000 vietnamese-ocr-api:test
        sleep 10
        curl -f http://localhost:3000/api/health || exit 1
        docker stop test-container

  # Security Scan
  security-scan:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Run npm audit
      run: npm audit --audit-level=moderate
      continue-on-error: true

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy results to GitHub Security
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: 'trivy-results.sarif'

  # Code Quality
  code-quality:
    name: Code Quality Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Check code formatting
      run: |
        npx prettier --check "src/**/*.ts" || echo "Run 'npx prettier --write .' to format"
      continue-on-error: true

  # API Integration Test
  api-test:
    name: API Integration Test
    runs-on: ubuntu-latest
    needs: [typescript-check, python-check]

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18.x'
        cache: 'npm'

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        npm ci
        pip install -r requirement.txt
        pip install requests

    - name: Build application
      run: npm run build

    - name: Start server in background
      run: |
        npm start &
        echo $! > server.pid
      env:
        NODE_ENV: test
        USE_ONNX: false

    - name: Wait for server
      run: |
        for i in {1..30}; do
          curl -f http://localhost:3000/api/health && break
          sleep 1
        done

    - name: Run health check test
      run: curl -f http://localhost:3000/api/health

    - name: Stop server
      run: |
        kill $(cat server.pid) || true

  # Deployment (only on main branch)
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [typescript-check, python-check, docker-build, api-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Deploy notification
      run: |
        echo "🚀 Deployment would happen here"
        echo "Add your deployment steps (Docker Hub push, AWS deploy, etc.)"

    # Example: Push to Docker Hub
    # - name: Login to Docker Hub
    #   uses: docker/login-action@v2
    #   with:
    #     username: ${{ secrets.DOCKERHUB_USERNAME }}
    #     password: ${{ secrets.DOCKERHUB_TOKEN }}
    #
    # - name: Build and push
    #   uses: docker/build-push-action@v4
    #   with:
    #     push: true
    #     tags: yourusername/vietnamese-ocr-api:latest

  # Notification
  notify:
    name: Send Notifications
    runs-on: ubuntu-latest
    needs: [typescript-check, python-check, docker-build, api-test]
    if: always()

    steps:
    - name: Check job status
      run: |
        echo "Build status: ${{ needs.typescript-check.result }}"
        echo "Python status: ${{ needs.python-check.result }}"
        echo "Docker status: ${{ needs.docker-build.result }}"
        echo "API test status: ${{ needs.api-test.result }}"

    # Add Slack/Discord notification here if needed
